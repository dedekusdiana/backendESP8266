plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.smarthome.iot'
    compileSdk 34

    defaultConfig {
        applicationId "com.smarthome.iot"
        minSdk 24
        targetSdk 34
        // versionCode WAJIB naik tiap rilis supaya Android mau meng-update di atas versi lama.
        // Di GitHub Actions diisi otomatis dari nomor run (VERSION_CODE); lokal default 1.
        versionCode (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName "1.0." + (System.getenv("VERSION_CODE") ?: "1")
    }

    // Tanda tangan rilis. Kunci (keystore) HARUS SAMA tiap build, kalau tidak Android menolak update
    // ("aplikasi tidak terpasang"/harus uninstall). Nilainya diambil dari environment (GitHub Secrets),
    // bukan ditulis di sini. Kalau tidak diisi (mis. build lokal), release tidak ditandatangani.
    signingConfigs {
        release {
            def ksFile = System.getenv("KEYSTORE_FILE")
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias (System.getenv("KEY_ALIAS") ?: "smarthome")
                keyPassword (System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD"))
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("KEYSTORE_FILE")) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'

    // Push notifikasi (FCM)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
